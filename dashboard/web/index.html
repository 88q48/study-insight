<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>错题管理与学情诊断</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <header class="hero">
    <div>
      <h1>错题管理与学情诊断</h1>
      <p class="sub" id="meta-line">正在加载…</p>
    </div>
    <div class="hero-right">
      <div class="source-controls">
        <label class="control">设备
          <select id="device-select">
            <option value="win_device_01">win_device_01（三端统一）</option>
          </select>
        </label>
        <label class="control">数据源
          <select id="source-select">
            <option value="api">真实后端</option>
            <option value="mock">演示数据</option>
          </select>
        </label>
      </div>
      <span class="badge" id="source-badge">—</span>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="error" role="tab">错题诊断</button>
    <button class="tab" data-tab="focus" role="tab">专注与效率</button>
  </nav>

  <!-- ================= Tab 1：错题诊断 ================= -->
  <section class="tab-panel active" id="panel-error">
    <div class="cards" id="error-metrics"></div>

    <div class="grid-2">
      <div class="panel">
        <h2>各科错题分布</h2>
        <div class="chart" id="chart-radar"></div>
      </div>
      <div class="panel">
        <h2>各科消化进度</h2>
        <div class="chart" id="chart-subject-mastery"></div>
      </div>
    </div>

    <div class="grid-2 wide-left">
      <div class="panel">
        <h2>知识点薄弱榜</h2>
        <div class="chart" id="chart-knowledge"></div>
      </div>
      <div class="panel">
        <h2>错题消化漏斗</h2>
        <div class="chart" id="chart-funnel"></div>
      </div>
    </div>

    <div class="panel">
      <h2>每日新增 vs 消灭</h2>
      <div class="chart" id="chart-review"></div>
    </div>

    <div class="panel">
      <h2>诊断结论</h2>
      <ul class="tips" id="error-tips"></ul>
    </div>

    <div class="panel">
      <h2>今日重做清单</h2>
      <p class="note">按错题数排序，先做第 1 条，做完再看下一条。</p>
      <div class="redo-list" id="redo-list"></div>
      <p class="note" id="redo-total"></p>
    </div>
  </section>

  <!-- ================= Tab 2：专注与效率 ================= -->
  <section class="tab-panel" id="panel-focus">
    <div class="cards" id="focus-metrics"></div>

    <div class="panel">
      <h2>专注时长 vs 错题产出</h2>
      <div class="chart tall" id="chart-dual"></div>
    </div>

    <div class="panel">
      <h2>每日专注时长</h2>
      <div class="chart" id="chart-focus-line"></div>
    </div>

    <div class="panel">
      <h2>个人 vs 群体</h2>
      <div class="chart" id="chart-group"></div>
      <p class="note" id="rank-note"></p>
    </div>

    <div class="panel">
      <h2>效率诊断</h2>
      <ul class="tips" id="focus-tips"></ul>
    </div>
  </section>

  <footer class="foot" id="footer"></footer>

</div>

<script src="config.js"></script>
<script src="mock-data.js"></script>
<script src="lib/echarts.min.js"></script>
<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
